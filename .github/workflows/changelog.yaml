# Marca en rojo el PR que no registra su cambio en CHANGELOG.md, también los de Dependabot.
name: Changelog

on:
  pull_request:

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout con historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comprobar la entrada
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx CHANGELOG.md; then
            echo "El PR registra su cambio en CHANGELOG.md."
          else
            echo "::error file=CHANGELOG.md::Este PR no registra su cambio en CHANGELOG.md."
            exit 1
          fi
