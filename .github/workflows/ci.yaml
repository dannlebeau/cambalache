# Aplica las migraciones en un Postgres de Supabase y corre las pruebas pgTAP de las reglas
# del mercado (supabase/tests). Si falla, el PR queda en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  pruebas-db:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      # Solo Postgres (con las migraciones aplicadas); el resto de servicios no hace falta.
      - name: Levantar la base
        run: supabase db start

      - name: Pruebas pgTAP
        run: supabase test db
